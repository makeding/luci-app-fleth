---
name: Build package for luci-app-fleth

on:
  push:
    tags:
      - '*'
    branches:
      - master
      - test-ci
      - dev
jobs:
  build:
    name: Build ${{ matrix.package_type }} ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    environment: runner
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - package_type: ipk
            arch: x86_64-22.03.2
            variant: legacy
          - package_type: apk
            arch: x86_64-25.12.4
            variant: legacy
          - package_type: ipk
            arch: x86_64-22.03.2
            variant: proto
          - package_type: apk
            arch: x86_64-25.12.4
            variant: proto
    steps:
      - name: Fetch luci-app-fleth code
        uses: actions/checkout@v6
        with:
          path: 'huggy/luci-app-fleth'
      - name: Fetch po2lmo code
        uses: actions/checkout@v6
        with:
          repository: 'openwrt-dev/po2lmo'
          ref: 'db656750ab032f3056d329c5e727a10af9ba15dd'
          path: 'huggy/luci-app-fleth/po2lmo'
      - name: 'Make po2lmo binary'
        run: 'cd $GITHUB_WORKSPACE/huggy/luci-app-fleth/po2lmo && make'
      - name: 'Manual convert i18n(lmo) file'
        run: |
          mkdir -p $GITHUB_WORKSPACE/huggy/luci-app-fleth/root/usr/lib/lua/luci/i18n
          $GITHUB_WORKSPACE/huggy/luci-app-fleth/po2lmo/src/po2lmo $GITHUB_WORKSPACE/huggy/luci-app-fleth/po/ja/fleth.po $GITHUB_WORKSPACE/huggy/luci-app-fleth/root/usr/lib/lua/luci/i18n/fleth.ja.lmo
          $GITHUB_WORKSPACE/huggy/luci-app-fleth/po2lmo/src/po2lmo $GITHUB_WORKSPACE/huggy/luci-app-fleth/po/zh_Hans/fleth.po $GITHUB_WORKSPACE/huggy/luci-app-fleth/root/usr/lib/lua/luci/i18n/fleth.zh-cn.lmo
          $GITHUB_WORKSPACE/huggy/luci-app-fleth/po2lmo/src/po2lmo $GITHUB_WORKSPACE/huggy/luci-app-fleth/po/zh_Hant/fleth.po $GITHUB_WORKSPACE/huggy/luci-app-fleth/root/usr/lib/lua/luci/i18n/fleth.zh-tw.lmo

      - name: Select ${{ matrix.variant }} variant
        run: |
          cd $GITHUB_WORKSPACE/huggy/luci-app-fleth
          if [ "${{ matrix.variant }}" = "proto" ]; then
            sed -i "0,/default y/s/default y/default n/" Makefile
            sed -i "/config PACKAGE_\$(PKG_NAME)_INCLUDE_PROTO_FLETH/,/help/s/default n/default y/" Makefile
          fi

      - name: Build ${{ matrix.package_type }} ${{ matrix.variant }}
        uses: openwrt/gh-action-sdk@main
        env:
          # We only use lua and shellscript, so it will worked on arm / mips router
          ARCH: ${{ matrix.arch }}
          PACKAGES: luci-app-fleth
          FEEDNAME: huggy
          NO_REFRESH_CHECK: true
      # - name: Checkout apk-signer
      #   if: matrix.package_type == 'apk'
      #   uses: actions/checkout@v6
      #   with:
      #     repository: makeding/apk-remote-signer
      #     path: apk-signer

      # - name: Sign APK
      #   if: matrix.package_type == 'apk'
      #   env:
      #     APK_SIGNER_URL: ${{ secrets.APK_SIGNER_URL }}
      #     APK_SIGNER_KEY: ${{ secrets.APK_SIGNER_KEY }}
      #   run: |
      #     for apk in bin/packages/x86_64/huggy/luci-app-fleth*.apk; do
      #       python3 apk-signer/scripts/sign.py "$apk" "$apk.signed"
      #       mv "$apk.signed" "$apk"
      #     done
      - name: Prepare artifacts
        run: |
          set -eu
          mkdir -p dist
          find bin/packages/x86_64/huggy -maxdepth 1 -type f -name "luci-app-fleth*.${{ matrix.package_type }}" | while read -r pkg; do
            base=$(basename "$pkg")
            case "$base" in
              luci-app-fleth_*) out="luci-app-fleth-${{ matrix.variant }}_${base#luci-app-fleth_}" ;;
              luci-app-fleth-*) out="luci-app-fleth-${{ matrix.variant }}-${base#luci-app-fleth-}" ;;
              *) out="luci-app-fleth-${{ matrix.variant }}-$base" ;;
            esac
            cp "$pkg" "dist/$out"
          done
          test "$(find dist -maxdepth 1 -type f -name 'luci-app-fleth-${{ matrix.variant }}*.${{ matrix.package_type }}' | wc -l)" -gt 0
          cp bin/packages/x86_64/huggy/luci-i18n-fleth-*.${{ matrix.package_type }} dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-fleth-${{ matrix.package_type }}-${{ matrix.variant }}
          path: dist/
      # - name: 'Pack all packages'
      #   run: tar cf pack.tar bin/packages/x86_64/base/ds-lite* bin/packages/x86_64/base/ds-lite*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # draft: true
          make_latest: true
          files: dist/luci-app-fleth-${{ matrix.variant }}_*
