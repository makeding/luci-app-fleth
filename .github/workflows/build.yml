---
name: Build package for luci-proto-fleth

on:
  push:
    tags:
      - '*'
    branches:
      - master
      - test-ci
      - dev
jobs:
  build:
    name: Build ${{ matrix.package_type }} ${{ matrix.package_name }}
    runs-on: ubuntu-24.04
    environment: runner
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - package_type: ipk
            arch: x86_64-22.03.2
            package_name: luci-proto-fleth
          - package_type: apk
            arch: x86_64-25.12.1
            package_name: luci-proto-fleth
    steps:
      - name: Fetch luci-proto-fleth code
        uses: actions/checkout@v6
        with:
          path: huggy/${{ matrix.package_name }}
      - name: Fetch po2lmo code
        uses: actions/checkout@v6
        with:
          repository: 'openwrt-dev/po2lmo'
          ref: 'db656750ab032f3056d329c5e727a10af9ba15dd'
          path: huggy/${{ matrix.package_name }}/po2lmo
      - name: 'Make po2lmo binary'
        run: 'cd $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po2lmo && make'
      - name: 'Manual convert i18n(lmo) file'
        run: |
          mkdir -p $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/root/usr/lib/lua/luci/i18n
          $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po2lmo/src/po2lmo $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po/ja/fleth.po $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/root/usr/lib/lua/luci/i18n/fleth.ja.lmo
          $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po2lmo/src/po2lmo $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po/zh_Hans/fleth.po $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/root/usr/lib/lua/luci/i18n/fleth.zh-cn.lmo
          $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po2lmo/src/po2lmo $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/po/zh_Hant/fleth.po $GITHUB_WORKSPACE/huggy/${{ matrix.package_name }}/root/usr/lib/lua/luci/i18n/fleth.zh-tw.lmo

      - name: Build ${{ matrix.package_type }} ${{ matrix.package_name }}
        uses: openwrt/gh-action-sdk@main
        env:
          # We only use lua and shellscript, so it will worked on arm / mips router
          ARCH: ${{ matrix.arch }}
          PACKAGES: ${{ matrix.package_name }}
          FEEDNAME: huggy
          NO_REFRESH_CHECK: true
      # - name: Checkout apk-signer
      #   if: matrix.package_type == 'apk'
      #   uses: actions/checkout@v6
      #   with:
      #     repository: makeding/apk-remote-signer
      #     path: apk-signer

      # - name: Sign APK
      #   if: matrix.package_type == 'apk'
      #   env:
      #     APK_SIGNER_URL: ${{ secrets.APK_SIGNER_URL }}
      #     APK_SIGNER_KEY: ${{ secrets.APK_SIGNER_KEY }}
      #   run: |
      #     for apk in bin/packages/x86_64/huggy/luci-proto-fleth*.apk; do
      #       python3 apk-signer/scripts/sign.py "$apk" "$apk.signed"
      #       mv "$apk.signed" "$apk"
      #     done
      - name: Prepare artifacts
        id: prepare_artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t packages < <(find bin/packages/x86_64/huggy -maxdepth 1 -type f -name '${{ matrix.package_name }}*.${{ matrix.package_type }}' | sort)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one ${{ matrix.package_name }}.${{ matrix.package_type }} package, found ${#packages[@]}."
            find bin/packages/x86_64/huggy -maxdepth 1 -type f | sort
            exit 1
          fi
          cp "${packages[0]}" dist/
          echo "path=dist/$(basename "${packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifact.outputs.path }}
          if-no-files-found: error
          archive: false
      # - name: 'Pack all packages'
      #   run: tar cf pack.tar bin/packages/x86_64/base/ds-lite* bin/packages/x86_64/base/ds-lite*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # draft: true
          prerelease: ${{ startsWith(github.ref_name, 'p') }}
          make_latest: ${{ startsWith(github.ref_name, 'p') && 'false' || 'true' }}
          files: ${{ steps.prepare_artifact.outputs.path }}
